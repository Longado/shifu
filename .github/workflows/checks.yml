name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: CLI (cargo test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  app:
    name: Desktop frontend (test + build)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@v4
        with:
          path: target/remote-tools
          key: wasm-bindgen-0.2.130-${{ runner.os }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: remote/crypto
      # The remote channel imports a WASM crypto module built from remote/crypto.
      - run: bash scripts/build-remote-crypto.sh
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  web:
    name: shifu web runtime (real headless Chromium)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx playwright-core install --with-deps chromium
      - run: |
          node test/ci-connector.cjs serve &
          for i in $(seq 1 30); do nc -z 127.0.0.1 9339 && break; sleep 1; done
      - run: npm test
        env:
          SHIFU_TEST_CONNECTOR: ${{ github.workspace }}/web/test/ci-connector.cjs
