name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (for JSON validation in hooks)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run tests
        run: |
          bash tests/run-tests.sh
          python3 -m py_compile hooks/scripts/context-tracker.py
