[package]
name = "shifu-app"
version = "0.1.0"
license = "MIT"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
portable-pty = "0.9"
shifu = { path = "../.." }
serde_json = "1"
toml = "1.2"
tauri-plugin-dialog = "2"

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"
