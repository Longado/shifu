[package]
license = "MIT"
name = "shifu-app"
version = "0.1.0"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
portable-pty = "0.9"
shifu = { path = "../.." }
serde_json = "1"
# Already in the tree (via serde_json and others); searching 100 MB transcripts for message lines.
memchr = "2"
# Already in the tree (portable-pty); per-process memory footprint and sysctl for the memory line.
libc = "0.2"
toml = "1.2"
tauri-plugin-dialog = "2"

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"

# The app ships as a debug build; the byte search over transcripts is optimised even there.
[profile.dev.package.memchr]
opt-level = 3
