[package]
license = "MIT"
name = "shifu-remote"
version = "0.1.0"
edition = "2024"

[dependencies]
shifu = { path = ".." }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "fs", "time"] }
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
